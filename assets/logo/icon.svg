<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="NovexDB">
  <!--
    NovexDB app icon.
    Composition:
      • Purple-violet gradient rounded-square (macOS-style 22% corner radius).
      • Faint network-graph texture (dots + connecting lines) reinforcing the
        "connected data" idea without competing with the foreground.
      • Stacked-disc database cylinder centred on the canvas, blue ↘ cyan,
        with a white sheen along the top-most disc.
    Every element is built from primitive SVG shapes (no fonts, no raster)
    so it stays crisp at every Electron icon size from 16 to 1024.

    macOS icon grid: Apple's visible-area template is 824×824 inside a
    1024×1024 transparent canvas (~100 px transparent margin on every
    side). Without that margin, the icon visually overshoots its
    neighbours in the Dock because the system can't shrink it any
    further. The wrapping `<g transform>` below scales the 1024-coord
    artwork down to that 824 inner square in one place, so the design
    coordinates further down stay readable.
  -->
 <g transform="translate(100 100) scale(0.8046875)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>

    <!-- Top of each database disc — bright, cool, with a subtle vertical fade. -->
    <linearGradient id="discTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <!-- Side wall of each disc — darker so the cylinder reads as 3D. -->
    <linearGradient id="discSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Soft drop shadow — pulls foreground forward off the purple field. -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 1. Background. -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!--
    2. Network-graph texture. Dots are placed on an irregular grid so the
       pattern doesn't read as a wallpaper; lines connect a handful so it
       reads as "graph", not "stars". Opacity stays low to never compete
       with the foreground at small sizes.
  -->
  <g fill="#ffffff" opacity="0.20">
    <circle cx="110" cy="160" r="6"/>
    <circle cx="270" cy="90" r="5"/>
    <circle cx="440" cy="190" r="5"/>
    <circle cx="620" cy="90" r="6"/>
    <circle cx="800" cy="170" r="5"/>
    <circle cx="940" cy="260" r="4"/>
    <circle cx="180" cy="340" r="4"/>
    <circle cx="930" cy="440" r="5"/>
    <circle cx="70" cy="600" r="4"/>
    <circle cx="100" cy="850" r="5"/>
    <circle cx="310" cy="910" r="4"/>
    <circle cx="700" cy="935" r="5"/>
    <circle cx="890" cy="800" r="4"/>
    <circle cx="965" cy="600" r="4"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.12">
    <path d="M 110 160 L 270 90 L 440 190 L 620 90 L 800 170 L 940 260"/>
    <path d="M 180 340 L 930 440"/>
    <path d="M 70 600 L 100 850 L 310 910 L 700 935 L 890 800 L 965 600"/>
  </g>

  <!--
    3. Database cylinder — three stacked tier-rings centered both
       horizontally and vertically in the canvas. Each ring = (back
       ellipse) + (rectangular side wall) + (top ellipse). Drawn in
       z-order from the back-most ring up so the top edges remain crisp.
       The whole stack is ~340 px tall, so translating to y=346 lands its
       midline on the canvas centre (512).
  -->
  <g transform="translate(326 346)" filter="url(#dropShadow)">
    <!-- Bottom ring -->
    <ellipse cx="186" cy="332" rx="186" ry="36" fill="#1e40af"/>
    <path d="M 0 296 L 0 332 A 186 36 0 0 0 372 332 L 372 296 Z" fill="url(#discSide)"/>
    <ellipse cx="186" cy="296" rx="186" ry="36" fill="url(#discTop)"/>
    <!-- Middle ring -->
    <path d="M 0 184 L 0 220 A 186 36 0 0 0 372 220 L 372 184 Z" fill="url(#discSide)"/>
    <ellipse cx="186" cy="184" rx="186" ry="36" fill="url(#discTop)"/>
    <!-- Top ring -->
    <path d="M 0 72 L 0 108 A 186 36 0 0 0 372 108 L 372 72 Z" fill="url(#discSide)"/>
    <ellipse cx="186" cy="72" rx="186" ry="36" fill="url(#discTop)"/>
    <!-- Glossy highlight on the top-most disc -->
    <ellipse cx="150" cy="64" rx="110" ry="9" fill="#ffffff" opacity="0.55"/>
  </g>
 </g>
</svg>
