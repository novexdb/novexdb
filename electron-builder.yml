appId: com.novexdb.app
productName: NovexDB
copyright: Copyright © 2026 NovexDB
directories:
  output: dist
  # `build/` is where `npm run icons` writes icon.icns / icon.ico / icon.png.
  # electron-builder auto-discovers them by name from `buildResources`, so
  # no platform needs an explicit `icon:` field below.
  buildResources: build
files:
  - out/**/*
  - package.json
# Anything dropped into `resources/` at the repo root gets bundled into the
# packaged app and extracted from the asar at runtime (handy for native
# binaries or large data files). Currently empty — keep the rule so future
# additions Just Work without revisiting the config.
asarUnpack:
  - resources/**

# ──────────────────────────────────────────────────────────────────────────────
# Auto-update feed (electron-updater).
#
# Two supported strategies — pick ONE:
#
# 1. GitHub Releases (default — zero infrastructure):
#      provider: github
#      owner:    your-github-username
#      repo:     novexdb
#    Build → upload artifacts to a GitHub Release → installed apps pick it up.
#
# 2. Generic / S3 / CloudFront / nginx (self-hosted):
#      provider: generic
#      url:      https://updates.novexdb.app
#    Upload the `latest-mac.yml` / `latest.yml` manifest + artifacts to that URL,
#    then set the env vars at runtime so the app overrides the publish block:
#      NOVEXDB_UPDATE_PROVIDER=generic
#      NOVEXDB_UPDATE_FEED_URL=https://updates.novexdb.app
#    The runtime override is what `src/main/services/update-config.ts` reads.
# ──────────────────────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: novexdb
  repo: novexdb
  # Auto-publish drafts. Without this, electron-builder uploads every
  # release as a hidden draft and `/releases/latest` returns 404 until
  # someone clicks "Publish" in the UI — which breaks the website's
  # download buttons and the in-app auto-updater (it polls `latest`).
  releaseType: release

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Drop ${version} from the filename so the GitHub URL
  # `…/releases/latest/download/NovexDB-arm64.dmg` is stable across
  # version bumps. The version is still visible inside the app's About
  # dialog + the DMG's metadata, so users who keep multiple downloads
  # can still tell them apart by file date.
  artifactName: ${productName}-${arch}.${ext}
  # ── Code signing ──────────────────────────────────────────────────────────
  # We deliberately DO NOT hardcode `identity` here. electron-builder
  # auto-discovers the Developer ID identity from whichever keychain is
  # available:
  #   • Local builds      → your login.keychain (where the cert was imported).
  #   • CI builds         → a temp keychain that electron-builder creates by
  #                         importing $CSC_LINK (base64-encoded .p12) using
  #                         $CSC_KEY_PASSWORD. Set both as GitHub Secrets.
  # When neither is available, electron-builder logs a warning and produces
  # an unsigned build instead of failing — so PRs/forks without secrets
  # still build cleanly.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # ── Notarization ──────────────────────────────────────────────────────────
  # Disabled by default. electron-builder hard-fails if `notarize` is set
  # but no credentials are present, which would break CI on machines
  # without the App Store Connect API key. To enable:
  #   1. Add GitHub Secrets APPLE_API_KEY (the .p8 contents, base64 or raw),
  #      APPLE_API_KEY_ID, APPLE_API_ISSUER. (Or APPLE_ID +
  #      APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID for the legacy path.)
  #   2. Flip the line below from `false` to:
  #        notarize:
  #          teamId: LYPYNA67H9
  notarize: false

win:
  target:
    - nsis
  # Same rationale as mac.artifactName — drop the version so the URL
  # `…/releases/latest/download/NovexDB-setup.exe` stays stable.
  artifactName: ${productName}-setup.${ext}
  # Code signing (uncomment + set env vars CSC_LINK + CSC_KEY_PASSWORD):
  # certificateFile: resources/win-cert.pfx
  # signingHashAlgorithms:
  #   - sha256
  # rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}.${ext}
