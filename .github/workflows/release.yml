name: Release

# Every push to `main` produces a new release.
#
#   1. The `bump` job auto-increments the patch version, pushes a
#      `chore(release): vX.Y.Z [skip ci]` commit + a `vX.Y.Z` tag.
#   2. The `build` matrix checks out *at the new tag* (so the artifacts'
#      embedded version matches), then builds + uploads to the matching
#      GitHub Release in parallel for macOS and Windows.
#   3. electron-updater on installed copies polls GitHub on its normal
#      schedule (default: every 60 min) and offers the update.
#
# Loop prevention: the bump commit carries `[skip ci]`, which GitHub
# Actions natively respects — the second run never starts.
#
# To ship a minor or major bump instead of a patch, edit `package.json`
# manually before pushing; CI sees the bumped version and ships that
# instead of patch-bumping again (the `npm version patch` here is a
# no-op when the version is already ahead of the latest tag).
on:
  push:
    branches: [main]
    # Docs / CI-config / website-only changes don't need a release.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'docs/**'
      - 'website/**'

concurrency:
  # Serialize releases — never run two in parallel, never cancel one
  # mid-flight (a half-uploaded Release is harder to clean up than
  # waiting an extra few minutes).
  group: release
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Bump version + tag.
  # ─────────────────────────────────────────────────────────────────────
  bump:
    name: Bump version & tag
    # Don't re-trigger ourselves: the bump commit's message ends with
    # `[skip ci]`. GitHub Actions respects that token by default, but
    # belt-and-braces.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `npm version` can create a tag relative
          # to existing ones.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump patch version + push tag
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          NEW=$(npm version patch -m 'chore(release): v%s [skip ci]')
          git push --follow-tags
          echo "new_version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "::notice title=Bumped::Version is now $NEW"

  # ─────────────────────────────────────────────────────────────────────
  # 2. Build + publish per platform, in parallel.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build & publish (${{ matrix.label }})
    needs: bump
    timeout-minutes: 45
    permissions:
      contents: write
    # Surfaced so the S3 step's `if:` can skip cleanly on forks / PRs where the
    # AWS secrets aren't configured (same graceful-skip idea as code signing).
    # Evaluating the secret here yields "true"/"false" without exposing its value.
    env:
      HAS_AWS_CREDS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.S3_BUCKET != '' }}
    strategy:
      # Don't let a Windows failure abort an in-flight macOS build —
      # partial releases are easier to deal with than no release at all.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64 + x64)
            cmd: npx electron-builder --mac --arm64 --x64 --publish always
          - os: windows-latest
            label: Windows (x64)
            cmd: npx electron-builder --win --x64 --publish always
    runs-on: ${{ matrix.os }}
    steps:
      # Check out the tag the bump job just created so the artifacts'
      # embedded version field matches the GitHub Release name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.new_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Regenerate the platform icons from `assets/logo/icon.svg` so the
      # bundled .icns / .ico match the current design. Idempotent — safe
      # to run on every release.
      - name: Generate icons
        run: npm run icons

      # electron-vite bundles main + preload + renderer to `out/`.
      - name: Build app bundles
        run: npm run build

      # electron-builder reads `publish` from electron-builder.yml + uses
      # GH_TOKEN to upload every artifact (DMG, ZIP, EXE, plus the
      # `latest-mac.yml` / `latest.yml` manifests that electron-updater
      # reads) to the GitHub Release matching the current package.json
      # version.
      - name: Package + publish
        run: ${{ matrix.cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing (electron-builder auto-discovers) ──────
          # CSC_LINK is a base64-encoded .p12 bundle containing the
          # "Developer ID Application" cert + its private key.
          # CSC_KEY_PASSWORD is the .p12 export password.
          # When either secret is missing, electron-builder skips signing
          # with a warning instead of failing — so the pipeline still
          # ships (unsigned) until both secrets are configured.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # ── macOS notarization (App Store Connect API key) ────────────
          # Only used once `notarize` is flipped on in electron-builder.yml.
          # Until then these are inert.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # ── Mirror the user-facing installers to S3 ───────────────────────────
      # The in-app auto-updater still pulls from GitHub Releases (the step
      # above). This step ONLY copies the installers users click to download
      # (.dmg / .exe) into your S3 bucket, so the website's download button can
      # link straight to S3 instead of redirecting to GitHub.
      #
      # Each platform runner uploads its own installer(s); together they fill
      # the bucket. Two prefixes:
      #   • latest/           → stable URL the website links to (overwritten
      #                          every release, so the link never changes)
      #   • releases/v<ver>/  → immutable per-version archive
      #
      # The AWS CLI is preinstalled on GitHub-hosted runners. `shell: bash`
      # forces Git Bash on the Windows runner so one script covers both OSes.
      # Skips cleanly when the AWS secrets aren't set (forks / PRs).
      - name: Publish installers to S3
        if: env.HAS_AWS_CREDS == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VERSION: ${{ needs.bump.outputs.new_version }}
        run: |
          set -euo pipefail
          # Stable "latest" copy. no-cache so the site always serves the newest
          # build the moment this release finishes.
          aws s3 cp dist/ "s3://${S3_BUCKET}/latest/" \
            --recursive --exclude "*" --include "*.dmg" --include "*.exe" \
            --cache-control "no-cache"
          # Immutable per-version archive (filename already carries no version,
          # so the prefix is what keeps old builds reachable).
          aws s3 cp dist/ "s3://${S3_BUCKET}/releases/v${VERSION}/" \
            --recursive --exclude "*" --include "*.dmg" --include "*.exe" \
            --cache-control "public, max-age=31536000, immutable"
          echo "::notice title=S3::Uploaded installers to s3://${S3_BUCKET}/latest/ and /releases/v${VERSION}/"
